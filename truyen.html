<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Đọc Truyện Ngắn - Dế Mèn Phiêu Lưu Ký</title>
    
    <!-- Nhúng CSS trực tiếp trong file HTML -->
    <style>
        /* CSS cho toàn bộ trang */
        body {
            font-family: Arial, Helvetica, sans-serif;
            line-height: 1.6;
            color: #333333;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f9f9f9;
        }

        /* Tiêu đề truyện */
        h1 {
            font-size: 28px;
            color: #2c3e50;
            text-align: center;
            margin-bottom: 20px;
        }

        /* Ảnh truyện đầu trang */
        .story-banner {
            width: 100%;
            max-height: 350px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 20px;
            display: block;
        }

        /* Khối mục lục truyện */
        .toc-container {
            border: 2px solid #3498db;
            background-color: #eaf2f8;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 30px;
        }

        .toc-container h5 {
            font-size: 18px;
            margin-top: 0;
            margin-bottom: 10px;
            color: #2980b9;
        }

        .toc-list {
            list-style-type: none;
            padding-left: 0;
            margin: 0;
        }

        .toc-list li {
            margin-bottom: 8px;
        }

        /* Liên kết mục lục và hiệu ứng Hover */
        .toc-list a {
            color: #34495e;
            text-decoration: none;
            font-weight: bold;
            transition: color 0.3s ease;
        }

        .toc-list a:hover {
            color: #e74c3c;
            text-decoration: underline;
        }

        /* Định dạng các chương nội dung */
        .chapter-content {
            background: #ffffff;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 25px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .chapter-content h5 {
            font-size: 20px;
            color: #2c3e50;
            border-bottom: 2px solid #eee;
            padding-bottom: 8px;
            margin-top: 0;
        }

        .chapter-content p {
            text-align: justify;
            text-indent: 20px;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>

    <!-- Tiêu đề truyện -->
    <h1>DẾ MÈN PHIÊU LƯU KÝ</h1>

    <!-- Ảnh truyện đặt ở đầu trang -->
    <img class="story-banner" src="https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?auto=format&fit=crop&w=800&q=80" alt="Ảnh trang đọc truyện">

    <!-- Khối mục lục truyện -->
    <div class="toc-container">
        <h5>MỤC LỤC TRUY
